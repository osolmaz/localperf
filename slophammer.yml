go:
  coverage:
    threshold: 85
  targets:
    - internal/runner
  exclude:
    - "**/*_test.go"
    - pattern: "examples/**"
      reason: example deployment documents, not production library code
    - pattern: "runs/**"
      reason: generated benchmark outputs and local run data
    - pattern: "docs/**"
      reason: markdown project plans and user docs
  dry:
    max_findings: 0
    paths:
      - cmd
      - internal
    exclude:
      - "**/*_test.go"
      - pattern: "examples/**"
        reason: example deployment documents, not production library code
      - pattern: "runs/**"
        reason: generated benchmark outputs and local run data
      - pattern: "docs/**"
        reason: markdown project plans and user docs
    structural:
      enabled: true
      threshold: 0.82
      min_lines: 4
      min_nodes: 20
    copied_blocks:
      enabled: true
      min_tokens: 100
  crap:
    max_score: 8
  mutation:
    targets:
      - internal/runner/config.go
      - internal/runner/report.go
      - internal/runner/sqlite_artifact.go
  dependency_boundaries:
    - from: cmd/localperf
      allow:
        - internal/benchcli
    - from: internal/benchcli
      allow:
        - internal/artifact
        - internal/report
        - internal/collections
        - internal/benchmarkconfig
        - internal/runner
        - internal/viewer
    - from: internal/benchmarkconfig
      allow:
        - internal/artifact
        - internal/runner
    - from: internal/bench
      allow: []
    - from: internal/artifact
      allow: []
    - from: internal/report
      allow:
        - internal/artifact
        - internal/bench
        - internal/collections
    - from: internal/reportmodel
      allow:
        - internal/report
    - from: internal/viewer
      allow:
        - internal/artifact
        - internal/report
        - internal/reportmodel
    - from: internal/runner
      allow:
        - internal/artifact
        - internal/bench
        - internal/collections
    - from: internal/collections
      allow: []
